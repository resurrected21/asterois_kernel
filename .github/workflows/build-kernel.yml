name: Build Kernel (Nothing 3a Pro · KSU-Next / SukiSU + SusFS)

# Builds a GKI android14-6.1 kernel for the Nothing Phone (3a) Pro [asteroids / sm7635]
# with a SELECTABLE root solution (KernelSU-Next OR SukiSU-Ultra) + SusFS,
# packaged as a flashable AnyKernel3 zip.
#
# Strategy: standalone Clang GKI build (NOT the Bazel/kleaf manifest build).
# The device boots a GKI kernel, so we only rebuild the generic GKI Image and
# repack it via AnyKernel3 — vendor_boot / vendor_dlkm stay stock.
#
# Toolchain: Neutron Clang (self-contained, fetched via antman). The AOSP
# googlesource subdir-archive endpoint returns HTTP 400, so we don't use it.
#
# Versions are PINNED to matched pairings (avoids upstream drift / SusFS mismatch):
#   KernelSU-Next : SUSFS v1.5.11 (simonpunk)  + KSU-Next a14-6.1-dev (2025-10)
#   SukiSU-Ultra  : SUSFS latest  (ShirkNeko)  + SukiSU builtin + scope-min hooks

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo to build"
        type: string
        default: "https://github.com/NothingOSS/android_kernel_msm-6.1_nothing_sm7635"
      kernel_branch:
        description: "Kernel source branch"
        type: string
        default: "sm7635/b/mr_Frogger"
      root_variant:
        description: "Root solution to build"
        type: choice
        options:
          - KernelSU-Next
          - SukiSU-Ultra
          - ReSukiSU
        default: KernelSU-Next
      enable_kpm:
        description: "SukiSU only: enable KPM (Kernel Patch Module) support"
        type: boolean
        default: false
      enable_susfs:
        description: "Include SusFS (untick to build root-only, e.g. to isolate a bootloop)"
        type: boolean
        default: true
      stock_boot_url:
        description: "Optional: direct URL to your STOCK boot.img — produces a patched boot.img"
        type: string
        default: ""
      stock_firmware_url:
        description: "Optional: URL to firmware/OTA zip or payload.bin — boot.img is auto-extracted"
        type: string
        default: ""
      make_release:
        description: "Publish outputs as a GitHub Release"
        type: boolean
        default: false

# Cancel an in-progress run if a newer one is started for the same ref.
concurrency:
  group: build-kernel-${{ github.ref }}-${{ github.event.inputs.root_variant }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to create Releases

env:
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3"
  SUSFS_BRANCH: "gki-android14-6.1"

  # --- KernelSU-Next pairing (simonpunk SUSFS v1.5.11) ---
  KSUN_SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  KSUN_SUSFS_COMMIT: "95348c38587f8213c86af17f9fcca01cab268d64"   # susfs4ksu v1.5.11
  KSUN_REF: "next-susfs-a14-6.1-dev"
  KSUN_COMMIT: "575d27f046f26f1081000e7ddd8b019e1bd39fb1"         # KSU-Next a14-6.1-dev

  # --- SukiSU-Ultra pairing (ShirkNeko SUSFS, current) ---
  SUKISU_SUSFS_REPO: "https://github.com/ShirkNeko/susfs4ksu.git"
  SUKISU_SUSFS_COMMIT: "25d87a06c2893c956fb8e5051816e9b381d1e750"  # ShirkNeko susfs (v2.1.0)
  SUKISU_REF: "builtin"
  SUKISU_COMMIT: "6c13a0695a1115e1000c998872b66f4ff5b2f11e"        # SukiSU-Ultra builtin
  SUKISU_PATCH_REPO: "https://github.com/SukiSU-Ultra/SukiSU_patch.git"
  SUKISU_HOOKS_PATCH: "hooks/scope_min_manual_hooks_v1.6.patch"

  # --- ReSukiSU pairing (auto manual-hooks; reuses simonpunk SUSFS v1.5.11) ---
  RESUKISU_REF: "main"
  RESUKISU_COMMIT: "4f2e69f79674df8e53c2165bb1633ad6130184ed"      # ReSukiSU main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --------------------------------------------------------------------
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # Trimmed for speed: android(~9G)+tool-cache(~8G)+dotnet(~2.7G) is
          # plenty of headroom; large-packages/swap removal are the slow parts.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      # --------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            dwarves flex git libssl-dev libelf-dev lz4 make openssl p7zip-full \
            python3 rsync unzip zip zstd libncurses-dev
          pahole --version   # provides BTF generation (CONFIG_DEBUG_INFO_BTF)

      # --------------------------------------------------------------------
      # Clone the kernel source (defaults to NothingOSS upstream + Frogger branch).
      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel
          echo "Source: ${{ github.event.inputs.kernel_repo }} @ ${{ github.event.inputs.kernel_branch }}"
          head -4 kernel/Makefile

      # --------------------------------------------------------------------
      # Cache the toolchain so it's downloaded/patched only once (bump the key
      # suffix to force a refresh).
      - name: Cache Neutron Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: neutron-clang-v2

      # Validate the (possibly cached) toolchain and re-download if it's missing
      # or broken — a restored-but-broken clang is what caused the
      # "ccache clang: unknown C compiler" failure.
      - name: Set up / verify Neutron Clang
        run: |
          ok=0
          if [ -x clang/bin/clang ] && clang/bin/clang -E -x c /dev/null >/dev/null 2>&1; then
            ok=1
          fi
          if [ "$ok" != 1 ]; then
            echo "Cached clang missing/broken — downloading fresh Neutron clang."
            rm -rf clang && mkdir -p clang && cd clang
            curl -LSs -o antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
            chmod +x antman
            ./antman -S
            ./antman --patch=glibc
            cd ..
          else
            echo "Cached Neutron clang verified."
          fi
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          clang/bin/clang --version | head -1
          # hard gate: must be detectable as a C compiler
          clang/bin/clang -E -x c /dev/null >/dev/null

      # ===================== KernelSU-Next path =====================
      - name: Add KernelSU-Next
        if: github.event.inputs.root_variant == 'KernelSU-Next'
        working-directory: kernel
        run: |
          # With SusFS: the a14-6.1-dev branch bundles the KSU-side SusFS code.
          # Without SusFS: use the plain 'next' branch (the susfs branch won't
          # compile without the kernel-side SusFS patch).
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            REF="$KSUN_REF"; PIN="$KSUN_COMMIT"
          else
            REF="next"; PIN=""
          fi
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "$REF"
          if [ -n "$PIN" ]; then
            ( cd KernelSU-Next && git fetch --depth 1 origin "$PIN" && git checkout -q "$PIN" )
            echo "KSU-Next pinned @ $PIN"
          fi
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            grep -q "config KSU_SUSFS" KernelSU-Next/kernel/Kconfig \
              || { echo "::error::KernelSU-Next checked out without SusFS support."; exit 1; }
            echo "Verified: KSU_SUSFS present."
          fi

      - name: Apply SusFS (KernelSU-Next · simonpunk v1.5.11)
        if: github.event.inputs.root_variant == 'KernelSU-Next' && github.event.inputs.enable_susfs == 'true'
        working-directory: kernel
        run: |
          mkdir -p ../susfs4ksu && cd ../susfs4ksu
          git init -q; git remote add origin "$KSUN_SUSFS_REPO"
          git fetch -q --depth 1 origin "$KSUN_SUSFS_COMMIT"; git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE/kernel"
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=3 < "../susfs4ksu/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch"

      # ===================== SukiSU-Ultra path =====================
      - name: Add SukiSU-Ultra
        if: github.event.inputs.root_variant == 'SukiSU-Ultra'
        working-directory: kernel
        run: |
          # 'builtin' branch = root compiled into the Image (no LKM needed).
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "$SUKISU_REF"
          ( cd KernelSU && git fetch --depth 1 origin "$SUKISU_COMMIT" \
              && git checkout -q "$SUKISU_COMMIT" )
          echo "SukiSU-Ultra pinned @ $SUKISU_COMMIT"

      - name: Apply SusFS (SukiSU-Ultra · ShirkNeko)
        if: github.event.inputs.root_variant == 'SukiSU-Ultra' && github.event.inputs.enable_susfs == 'true'
        working-directory: kernel
        run: |
          mkdir -p ../susfs4ksu && cd ../susfs4ksu
          git init -q; git remote add origin "$SUKISU_SUSFS_REPO"
          git fetch -q --depth 1 origin "$SUKISU_SUSFS_COMMIT"; git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE/kernel"
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=3 < "../susfs4ksu/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch"

      - name: Apply SukiSU manual hooks
        if: github.event.inputs.root_variant == 'SukiSU-Ultra'
        working-directory: kernel
        run: |
          # SukiSU uses manual syscall hooks (not kprobes) — always required.
          git clone --depth 1 "$SUKISU_PATCH_REPO" ../SukiSU_patch
          cp "../SukiSU_patch/$SUKISU_HOOKS_PATCH" ./sukisu_hooks.patch
          patch -p1 -F 3 < ./sukisu_hooks.patch

      # ===================== ReSukiSU path =====================
      - name: Add ReSukiSU
        if: github.event.inputs.root_variant == 'ReSukiSU'
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "$RESUKISU_REF"
          ( cd KernelSU && git fetch --depth 1 origin "$RESUKISU_COMMIT" \
              && git checkout -q "$RESUKISU_COMMIT" )
          echo "ReSukiSU pinned @ $RESUKISU_COMMIT"

      - name: Apply SusFS (ReSukiSU · simonpunk v1.5.11)
        if: github.event.inputs.root_variant == 'ReSukiSU' && github.event.inputs.enable_susfs == 'true'
        working-directory: kernel
        run: |
          # ReSukiSU auto-inserts its manual hooks via Kconfig (no source hook
          # patch needed on android14-6.1). Only the kernel-side SusFS is patched.
          mkdir -p ../susfs4ksu && cd ../susfs4ksu
          git init -q; git remote add origin "$KSUN_SUSFS_REPO"
          git fetch -q --depth 1 origin "$KSUN_SUSFS_COMMIT"; git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE/kernel"
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=3 < "../susfs4ksu/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch"

      # ===================== Common: inject Kconfig =====================
      - name: Inject KSU + SusFS Kconfig into gki_defconfig
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          cat >> "$DEFCONFIG" <<'EOF'
          # --- build with newer Neutron clang: don't fail on new warnings ---
          # CONFIG_WERROR is not set
          # --- KernelSU (all variants use CONFIG_KSU) ---
          CONFIG_KSU=y
          EOF

          # SusFS Kconfig — only when enabled.
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          # --- SusFS ---
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          EOF
          else
            echo "SusFS disabled — building root-only."
          fi

          # Variant-specific hook config (independent of SusFS).
          RV="${{ github.event.inputs.root_variant }}"
          if [ "$RV" = "SukiSU-Ultra" ]; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
            if [ "${{ github.event.inputs.enable_kpm }}" = "true" ]; then
              echo "CONFIG_KPM=y" >> "$DEFCONFIG"
            fi
          elif [ "$RV" = "ReSukiSU" ]; then
            # ReSukiSU: manual hooks auto-inserted via these Kconfig switches.
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y
          CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y
          EOF
          fi

      # --------------------------------------------------------------------
      # Restores compiled-object cache from the most recent prior run so
      # unchanged source isn't recompiled (saves ~8-10 min on reruns).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Build GKI kernel Image
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=prabh
          export KBUILD_BUILD_HOST=xeon
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_MAXSIZE=5G
          export CCACHE_COMPILERCHECK=content
          ccache -z >/dev/null 2>&1 || true

          # ccache "masquerade": prepend a dir with clang/clang++ -> ccache symlinks,
          # then the real Neutron toolchain. LLVM=1 invokes plain `clang`, which now
          # resolves to ccache, which in turn finds the real clang next in PATH.
          # This avoids the fragile CC="ccache clang" compiler-detection that broke.
          MASK="$GITHUB_WORKSPACE/cc-mask"
          mkdir -p "$MASK"
          ln -sf "$(command -v ccache)" "$MASK/clang"
          ln -sf "$(command -v ccache)" "$MASK/clang++"
          export PATH="$MASK:$GITHUB_WORKSPACE/clang/bin:$PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image
          echo "--- ccache stats ---"; ccache -s
          ls -lh out/arch/arm64/boot/Image

      # --------------------------------------------------------------------
      - name: Package with AnyKernel3
        run: |
          # Short tag for the chosen root variant + SusFS state.
          case "${{ github.event.inputs.root_variant }}" in
            SukiSU-Ultra) RV="SukiSU" ;;
            ReSukiSU)     RV="ReSukiSU" ;;
            *)            RV="KSU-Next" ;;
          esac
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then SFX="-SusFS"; else SFX="-noSusFS"; fi
          RV="${RV}${SFX}"

          git clone --depth=1 "$ANYKERNEL_REPO" AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          # Minimal GKI anykernel.sh (boot partition, A/B, no dtb repack)
          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 — Nothing Phone (3a) Pro [asteroids]
          properties() { '
          kernel.string=__KERNEL_STRING__
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=asteroids
          device.name2=Pong
          supported.versions=
          supported.patchlevels=
          '; }
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          sed -i "s|__KERNEL_STRING__|Xeon · Nothing 3a Pro ${RV} by prabh (resurrected21)|" \
            AnyKernel3/anykernel.sh

          cd AnyKernel3
          ZIP="../Xeon-NP3aPro-${RV}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP" * -x '*.git*' README.md
          echo "ZIP_NAME=$(basename "$ZIP")" >> "$GITHUB_ENV"

      # --------------------------------------------------------------------
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: "*.zip"
          if-no-files-found: error

      # --------------------------------------------------------------------
      # Optional: produce a flashable boot.img by swapping our kernel into the
      # STOCK boot.img (3a Pro is an init_boot device, so boot.img = kernel only;
      # init_boot/vendor stay stock). This is the RELIABLE install route —
      # `fastboot flash boot` — and avoids the on-device AnyKernel repack.
      #
      # Source the stock boot.img from either:
      #   stock_boot_url      — a direct boot.img, OR
      #   stock_firmware_url  — a firmware/OTA zip or payload.bin (auto-extracted).
      - name: Build patched boot.img
        id: bootimg
        if: github.event.inputs.stock_boot_url != '' || github.event.inputs.stock_firmware_url != ''
        run: |
          case "${{ github.event.inputs.root_variant }}" in
            SukiSU-Ultra) RV="SukiSU" ;; ReSukiSU) RV="ReSukiSU" ;; *) RV="KSU-Next" ;;
          esac
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then RV="${RV}-SusFS"; else RV="${RV}-noSusFS"; fi
          mkdir -p bootwork && cd bootwork

          # magiskboot (host x86_64 tool) straight from the official Magisk APK.
          MAGISK_APK=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | grep -oE 'https://[^"]+Magisk-v[^"]+\.apk' | head -1)
          echo "Magisk APK: $MAGISK_APK"
          curl -L -o magisk.apk "$MAGISK_APK"
          unzip -o -q magisk.apk 'lib/x86_64/*' -d magisk
          cp magisk/lib/x86_64/libmagiskboot.so ./magiskboot && chmod +x ./magiskboot

          # ---- obtain the stock boot.img (handles .7z / .zip / .gz / .img / payload.bin) ----
          SRC_URL="${{ github.event.inputs.stock_boot_url }}"
          [ -z "$SRC_URL" ] && SRC_URL="${{ github.event.inputs.stock_firmware_url }}"
          echo "Stock source: $SRC_URL"
          curl -L -o src.dl "$SRC_URL"

          case "$SRC_URL" in
            *.7z)          7z x -y src.dl >/dev/null ;;
            *.zip)         unzip -o -q src.dl ;;
            *.tar.gz|*.tgz) tar xf src.dl ;;
            *.gz)          gzip -dc src.dl > extracted.img ;;
            *.img)         cp src.dl stock_boot.img ;;
            *.bin)         cp src.dl payload.bin ;;
            *)             cp src.dl unknown.bin ;;
          esac

          # Locate the boot image from whatever the archive produced.
          if [ ! -f stock_boot.img ]; then
            B=$(find . -name 'boot.img' | head -1)
            if [ -n "$B" ]; then
              cp "$B" stock_boot.img
            elif [ -f extracted.img ]; then
              mv extracted.img stock_boot.img
            else
              P=$(find . -name 'payload.bin' | head -1)
              [ -z "$P" ] && [ -f unknown.bin ] && P=unknown.bin
              if [ -n "$P" ]; then
                PD_URL=$(curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest \
                  | grep -oE 'https://[^"]+_linux_amd64\.tar\.gz' | head -1)
                curl -L -o pd.tgz "$PD_URL"; tar xf pd.tgz
                ./payload-dumper-go -p boot -o . "$P"
                mv boot.img stock_boot.img
              fi
            fi
          fi
          [ -f stock_boot.img ] || { echo "::error::Could not find a boot.img in the stock source."; exit 1; }
          head -c8 stock_boot.img | grep -q ANDROID \
            || echo "::warning::stock_boot.img doesn't start with 'ANDROID!' — wrong file?"

          # ---- swap kernel & repack ----
          ./magiskboot unpack stock_boot.img
          cp ../kernel/out/arch/arm64/boot/Image ./kernel        # swap in our kernel
          ./magiskboot repack stock_boot.img                     # -> new-boot.img
          mv new-boot.img "../Xeon-NP3aPro-${RV}-boot.img"
          cd ..
          echo "BOOT_IMG=Xeon-NP3aPro-${RV}-boot.img" >> "$GITHUB_ENV"
          ls -lh "Xeon-NP3aPro-${RV}-boot.img"

      - name: Upload patched boot.img
        if: steps.bootimg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOOT_IMG }}
          path: ${{ env.BOOT_IMG }}
          if-no-files-found: error

      # --------------------------------------------------------------------
      - name: Create GitHub Release
        if: github.event.inputs.make_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ github.run_number }}
          name: "Nothing 3a Pro · ${{ github.event.inputs.root_variant }} + SusFS (build ${{ github.run_number }})"
          body: |
            Automated kernel build for **Nothing Phone (3a) Pro** [asteroids / sm7635].

            - Root: **${{ github.event.inputs.root_variant }}** + SusFS
            - Base: GKI android14-6.1 (6.1.x)
            - Flash the **AnyKernel3 zip** in recovery, **or** `fastboot flash boot` the boot.img (if attached).

            ⚠️ Unlocked bootloader required. First KSU flash wipes data (`fastboot -w`). Back up first.
          files: |
            *.zip
            *boot.img
          fail_on_unmatched_files: false
