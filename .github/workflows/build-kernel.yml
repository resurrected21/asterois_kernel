name: Build Asteroid Kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Root Solution Variant'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'None'
      susfs:
        description: 'Include SusFS? (Ignored if Variant is None)'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'
      kpm:
        description: 'Enable KPM? (Only applicable for SukiSU-Ultra)'
        required: true
        default: 'n'
        type: choice
        options:
          - 'y'
          - 'n'
      toolchain:
        description: 'Compiler Toolchain'
        required: true
        default: 'aosp'
        type: choice
        options:
          - 'aosp'
          - 'neutron'
      disable_lto:
        description: 'Disable LTO for faster build compilation?'
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl dwarves flex git \
            libssl-dev libelf-dev lz4 make openssl p7zip-full python3 rsync unzip zip zstd libncurses-dev

      - name: Set Environment Variables
        run: |
          echo "ROOT=$GITHUB_WORKSPACE/workspace" >> $GITHUB_ENV
          echo "KSRC=$GITHUB_WORKSPACE/workspace/kernel" >> $GITHUB_ENV
          echo "OUT=$GITHUB_WORKSPACE/workspace/out" >> $GITHUB_ENV
          echo "TCROOT=$GITHUB_WORKSPACE/workspace/toolchain" >> $GITHUB_ENV
          echo "TOOLS=$GITHUB_WORKSPACE/workspace/tools" >> $GITHUB_ENV
          echo "CACHE=$GITHUB_WORKSPACE/workspace/cache" >> $GITHUB_ENV
          echo "AK3=$GITHUB_WORKSPACE/workspace/AnyKernel3" >> $GITHUB_ENV
          echo "CCDIR=$GITHUB_WORKSPACE/workspace/.ccache" >> $GITHUB_ENV
          
          echo "KERNEL_REPO=https://github.com/NothingOSS/android_kernel_msm-6.1_nothing_sm7635" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=sm7635/b/mr_Frogger" >> $GITHUB_ENV
          echo "DEVICE_PROJECT=Asteroids" >> $GITHUB_ENV
          echo "SOC=volcano" >> $GITHUB_ENV
          echo "SUSFS_BRANCH=gki-android14-6.1" >> $GITHUB_ENV
          echo "AOSP_CLANG_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz" >> $GITHUB_ENV
          
          echo "KSUN_REF=next-susfs-a14-6.1-dev" >> $GITHUB_ENV
          echo "KSUN_COMMIT=575d27f046f26f1081000e7ddd8b019e1bd39fb1" >> $GITHUB_ENV
          echo "KSUN_SUSFS_REPO=https://gitlab.com/simonpunk/susfs4ksu.git" >> $GITHUB_ENV
          echo "KSUN_SUSFS_COMMIT=95348c38587f8213c86af17f9fcca01cab268d64" >> $GITHUB_ENV
          echo "SUKISU_REF=builtin" >> $GITHUB_ENV
          echo "SUKISU_COMMIT=6c13a0695a1115e1000c998872b66f4ff5b2f11e" >> $GITHUB_ENV
          echo "SUKISU_SUSFS_REPO=https://github.com/ShirkNeko/susfs4ksu.git" >> $GITHUB_ENV
          echo "SUKISU_SUSFS_COMMIT=25d87a06c2893c956fb8e5051816e9b381d1e750" >> $GITHUB_ENV
          echo "SUKISU_PATCH_REPO=https://github.com/SukiSU-Ultra/SukiSU_patch.git" >> $GITHUB_ENV
          echo "SUKISU_HOOKS=hooks/scope_min_manual_hooks_v1.6.patch" >> $GITHUB_ENV
          echo "RESUKISU_REF=main" >> $GITHUB_ENV
          echo "RESUKISU_COMMIT=4f2e69f79674df8e53c2165bb1633ad6130184ed" >> $GITHUB_ENV
          echo "RESUKISU_SUSFS_COMMIT=25d87a06c2893c956fb8e5051816e9b381d1e750" >> $GITHUB_ENV

      - name: Prepare Workspace Directories
        run: |
          mkdir -p ${{ env.ROOT }} ${{ env.OUT }} ${{ env.TCROOT }} ${{ env.TOOLS }} ${{ env.CACHE }} ${{ env.CCDIR }}

      - name: Fetch Toolchain
        run: |
          TCDIR="${{ env.TCROOT }}/${{ github.event.inputs.toolchain }}"
          mkdir -p "$TCDIR"
          if [ "${{ github.event.inputs.toolchain }}" = "neutron" ]; then
            cd "$TCDIR"
            curl -LSs -o antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
            chmod +x antman
            ./antman -S
            ./antman --patch=glibc
          else
            curl -L --fail -o /tmp/aosp-clang.tgz "${{ env.AOSP_CLANG_URL }}"
            tar -xzf /tmp/aosp-clang.tgz -C "$TCDIR"
            rm -f /tmp/aosp-clang.tgz
          fi
          echo "TCDIR=$TCDIR" >> $GITHUB_ENV

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.KSRC }}

      - name: Generate Identity Tag
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          SUSFS="${{ github.event.inputs.susfs }}"
          if [ "$VARIANT" = "None" ]; then
            RVTAG="Stock"
          else
            if [ "$VARIANT" = "SukiSU-Ultra" ]; then RVTAG="SukiSU"; fi
            if [ "$VARIANT" = "ReSukiSU" ]; then RVTAG="ReSukiSU"; fi
            if [ "$VARIANT" = "KernelSU-Next" ]; then RVTAG="KSU-Next"; fi
            if [ "$SUSFS" = "y" ]; then RVTAG="${RVTAG}-SusFS"; else RVTAG="${RVTAG}-noSusFS"; fi
          fi
          echo "RVTAG=$RVTAG" >> $GITHUB_ENV
          echo "STAMP=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Apply Root Frameworks and Patches
        run: |
          cd ${{ env.KSRC }}
          VARIANT="${{ github.event.inputs.variant }}"
          SUSFS="${{ github.event.inputs.susfs }}"
          
          apply_susfs() {
            local repo="$1" commit="$2" d="${{ env.CACHE }}/$3"
            git init -q "$d" && git -C "$d" remote add origin "$repo"
            git -C "$d" fetch -q --depth 1 origin "$commit"
            git -C "$d" -c advice.detachedHead=false checkout -q FETCH_HEAD
            cp "$d"/kernel_patches/fs/* fs/
            cp "$d"/kernel_patches/include/linux/* include/linux/
            patch -p1 --fuzz=3 < "$d/kernel_patches/50_add_susfs_in_${{ env.SUSFS_BRANCH }}.patch"
          }

          case "$VARIANT" in
            KernelSU-Next)
              if [ "$SUSFS" = "y" ]; then REF="${{ env.KSUN_REF }}"; else REF=next; fi
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$REF"
              if [ "$SUSFS" = "y" ]; then
                cd KernelSU-Next && git fetch --depth 1 origin "${{ env.KSUN_COMMIT }}" && git checkout -q "${{ env.KSUN_COMMIT }}" && cd ..
                apply_susfs "${{ env.KSUN_SUSFS_REPO }}" "${{ env.KSUN_SUSFS_COMMIT }}" susfs-simonpunk
              fi ;;
            SukiSU-Ultra)
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ env.SUKISU_REF }}"
              cd KernelSU && git fetch --depth 1 origin "${{ env.SUKISU_COMMIT }}" && git checkout -q "${{ env.SUKISU_COMMIT }}" && cd ..
              if [ "$SUSFS" = "y" ]; then apply_susfs "${{ env.SUKISU_SUSFS_REPO }}" "${{ env.SUKISU_SUSFS_COMMIT }}" susfs-shirkneko; fi
              SKP="${{ env.CACHE }}/SukiSU_patch"
              git clone --depth 1 "${{ env.SUKISU_PATCH_REPO }}" "$SKP"
              cp "$SKP/${{ env.SUKISU_HOOKS }}" ./sukisu_hooks.patch
              patch -p1 -F 3 < ./sukisu_hooks.patch ;;
            ReSukiSU)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "${{ env.RESUKISU_REF }}"
              cd KernelSU && git fetch --depth 1 origin "${{ env.RESUKISU_COMMIT }}" && git checkout -q "${{ env.RESUKISU_COMMIT }}" && cd ..
              if [ "$SUSFS" = "y" ]; then apply_susfs "${{ env.KSUN_SUSFS_REPO }}" "${{ env.RESUKISU_SUSFS_COMMIT }}" susfs-simonpunk; fi
              
              cat > ${{ env.ROOT }}/resukisu_stat_hooks.py <<'PY'
          import re, sys
          f = sys.argv[1]; s = open(f).read()
          if "ksu_handle_newfstat_ret" in s: sys.exit(0)
          has_stat = "ksu_handle_stat" in s
          ext = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n"
          if not has_stat: ext += "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
          ext += "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
          ext += "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n"
          ext += "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n"
          ext += "#endif\n#endif\n\n"
          anchor = "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)"
          i = s.find(anchor); assert i != -1
          s = s[:i] + ext + s[i:]
          s, n = re.subn(r"(SYSCALL_DEFINE2\(fstat64,.*?cp_new_stat64\(&stat, statbuf\);\n)(\n\treturn error;)", r"\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\2", s, count=1, flags=re.S)
          s, n = re.subn(r"(COMPAT_SYSCALL_DEFINE2\(newfstat,.*?cp_compat_stat\(&stat, statbuf\);\n)(\treturn error;)", r"\1#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, (struct stat __user**)&statbuf);\n#endif\n\2", s, count=1, flags=re.S)
          if not has_stat:
              s, n = re.subn(r"(SYSCALL_DEFINE4\(newfstatat,.*?\n\tint error;\n)(\n\terror = vfs_fstatat)", r"\1\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\2", s, count=1, flags=re.S)
          open(f, "w").write(s)
          PY
              python3 ${{ env.ROOT }}/resukisu_stat_hooks.py fs/stat.c ;;
          esac

      - name: Inject Kconfig Fragments
        run: |
          cd ${{ env.KSRC }}
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          echo "# CONFIG_WERROR is not set" >> "$DEFCONFIG"
          echo "# CONFIG_MODULE_SIG_ALL is not set" >> "$DEFCONFIG"
          
          for FRAG in "arch/arm64/configs/vendor/${{ env.SOC }}_GKI.config" \
                      "arch/arm64/configs/vendor/${{ env.DEVICE_PROJECT }}.config"; do
            if [ -f "$FRAG" ]; then
              cat "$FRAG" >> "$DEFCONFIG"
              echo "Applied fragment: $FRAG"
            else
              echo "!! Fragment missing: $FRAG" && exit 1
            fi
          done
          
          echo "CONFIG_LOCALVERSION=\"-gki\"" >> "$DEFCONFIG"
          
          if [ "${{ github.event.inputs.variant }}" != "None" ]; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            if [ "${{ github.event.inputs.susfs }}" = "y" ]; then
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
            fi
            
            case "${{ github.event.inputs.variant }}" in
              SukiSU-Ultra)
                echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
                if [ "${{ github.event.inputs.kpm }}" = "y" ]; then echo "CONFIG_KPM=y" >> "$DEFCONFIG"; fi ;;
              ReSukiSU)
                printf 'CONFIG_KSU_MANUAL_HOOK=y\nCONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y\nCONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y\nCONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y\n' >> "$DEFCONFIG" ;;
            esac
          fi

      - name: Build Kernel Image
        run: |
          cd ${{ env.KSRC }}
          export CCACHE_DIR="${{ env.CCDIR }}" CCACHE_MAXSIZE=10G CCACHE_COMPILERCHECK=content
          export KBUILD_BUILD_USER=prabh KBUILD_BUILD_HOST=xeon ARCH=arm64 SUBARCH=arm64
          
          MASK="${{ env.ROOT }}/.ccmask"; mkdir -p "$MASK"
          ln -sf "$(command -v ccache)" "$MASK/clang"
          ln -sf "$(command -v ccache)" "$MASK/clang++"
          export PATH="$MASK:${{ env.TCDIR }}/bin:$PATH"
          
          MK="O=${{ env.OUT }} ARCH=arm64 LLVM=1 LLVM_IAS=1"
          make $MK gki_defconfig
          
          if [ "${{ github.event.inputs.disable_lto }}" = "y" ]; then
            ./scripts/config --file "${{ env.OUT }}/.config" -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE
            make $MK olddefconfig
          fi
          
          make $MK NT_PROJECT="${{ env.DEVICE_PROJECT }}" -j"$(nproc)" Image

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ${{ env.AK3 }}
          
          mkdir -p ${{ env.TOOLS }}
          url=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | grep -oE 'https://[^"]+Magisk-v[^"]+\.apk' | head -1)
          curl -L --fail -o "${{ env.TOOLS }}/Magisk-latest.apk" "$url"
          unzip -o -q "${{ env.TOOLS }}/Magisk-latest.apk" "lib/arm64-v8a/libmagiskboot.so" -d /tmp/mb_arm
          install -m755 "/tmp/mb_arm/lib/arm64-v8a/libmagiskboot.so" "${{ env.AK3 }}/tools/magiskboot"
          
          cp ${{ env.OUT }}/arch/arm64/boot/Image ${{ env.AK3 }}/Image
          
          cat > ${{ env.AK3 }}/anykernel.sh <<EOF
          ### AnyKernel3 — Nothing Phone (3a) Pro [asteroids]
          properties() { '
          kernel.string=Xeon · Nothing 3a Pro ${{ env.RVTAG }} by prabh (GHA Build)
          device.name1=asteroids
          device.name2=Bakery
          device.name3=NothingPhone3a
          supported.versions=
          supported.patchlevels=
          '; }
          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          
          cd ${{ env.AK3 }}
          ZIP_NAME="Xeon-NP3aPro-${{ env.RVTAG }}-${{ env.STAMP }}.zip"
          zip -r9 "$ZIP_NAME" . -x '*.git*' README.md >/dev/null
          mv "$ZIP_NAME" ${{ env.ROOT }}/
          echo "FINAL_ZIP_PATH=${{ env.ROOT }}/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xeon-Kernel-Asteroids-${{ env.RVTAG }}-${{ env.STAMP }}
          path: ${{ env.ROOT }}/*.zip
          
